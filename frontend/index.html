<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ===================== PRIMARY SEO ===================== -->
    <title>HireHub | Smart Hiring & AI Recruitment Platform</title>
    <meta
      name="description"
      content="HireHub is an AI-powered recruitment and talent acquisition platform. Post jobs, manage company profiles, schedule assessments, and hire top talent faster — all in one place."
    />
    <meta
      name="keywords"
      content="HireHub, AI recruitment, hiring platform, talent acquisition, job posting, applicant tracking system, ATS, HR software, recruitment software, online assessments"
    />
    <meta name="author" content="HireHub" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://hirehub.com/" />

    <!-- ===================== OPEN GRAPH (Facebook / LinkedIn / WhatsApp) ===================== -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HireHub" />
    <meta property="og:url" content="https://hirehub.com/" />
    <meta property="og:title" content="HireHub | Smart Hiring & AI Recruitment Platform" />
    <meta
      property="og:description"
      content="AI-powered recruitment platform to post jobs, manage company profiles, and schedule assessments. Hire smarter and faster with HireHub."
    />
    <meta property="og:image" content="https://hirehub.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HireHub — AI-Powered Recruitment Platform" />
    <meta property="og:locale" content="en_US" />

    <!-- ===================== TWITTER CARD ===================== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@hirehub" />
    <meta name="twitter:creator" content="@hirehub" />
    <meta name="twitter:title" content="HireHub | Smart Hiring & AI Recruitment Platform" />
    <meta
      name="twitter:description"
      content="AI-powered recruitment platform to post jobs, manage company profiles, and schedule assessments."
    />
    <meta name="twitter:image" content="https://hirehub.com/og-image.png" />

    <!-- ===================== THEME / BRAND ===================== -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="HireHub" />
    <meta name="apple-mobile-web-app-title" content="HireHub" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- ===================== FAVICONS ===================== -->
    <link rel="icon" type="image/webp" href="/logo-transparent.webp" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- ===================== PERFORMANCE ===================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- ===================== STRUCTURED DATA (JSON-LD) ===================== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HireHub",
        "url": "https://hirehub.com/",
        "logo": "https://hirehub.com/logo.png",
        "description": "AI-powered recruitment and talent acquisition platform.",
        "sameAs": [
          "https://twitter.com/hirehub",
          "https://www.linkedin.com/company/hirehub",
          "https://www.facebook.com/hirehub"
        ]
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HireHub",
        "url": "https://hirehub.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://hirehub.com/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "HireHub",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI-powered recruitment platform to post jobs, manage company profiles, and schedule assessments.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.8",
          "ratingCount": "1200"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <h1>HireHub — AI-Powered Recruitment Platform</h1>
      <p>
        HireHub helps companies post jobs, manage company profiles, schedule
        assessments, and hire top talent faster. Please enable JavaScript to use
        the full application.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
