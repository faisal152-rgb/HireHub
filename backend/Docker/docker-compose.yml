services:

  redis:
    image: redis:alpine
    container_name: hirehub-redis
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: hirehub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: hirehub-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  gateway:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        SERVICE: Gateway
    container_name: hirehub-gateway
    ports:
      - "3000:3000"
    depends_on:
      - admin
      - company
      - candidate
      - redis

  admin:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        SERVICE: Admin
    container_name: hirehub-admin
    expose:
      - "3001"
    depends_on:
      - redis
      - kafka

  company:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        SERVICE: Company
    container_name: hirehub-company
    expose:
      - "3002"
    depends_on:
      - redis
      - kafka

  candidate:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        SERVICE: Candidate
    container_name: hirehub-candidate
    expose:
      - "3003"
    depends_on:
      - redis
      - kafka